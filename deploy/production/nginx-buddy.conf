# Configuration fragment for the existing TLS virtual host
# buddy.dungeonmind.net. Keep the Buddy process bound to a private interface
# or host loopback; match the upstream port to the verified Compose binding.

location / {
    gzip off;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Match only the PDF admission route. Buddy independently enforces this cap.
    location ~ ^/api/live/agent/worlds/[^/]+/build-pdf-sources$ {
        client_max_body_size 32m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    # OCR, model validation and Graph writes may finish after the normal API deadline.
    location ~ ^/api/live/agent/worlds/[^/]+/build-pdf-sources/statblock-reviews/[^/]+/(from-regions|validate|accept/[^/]+|publication)$ {
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:8080;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        gzip on;
        gzip_vary on;
        gzip_types application/javascript text/javascript text/css;
    }
}
