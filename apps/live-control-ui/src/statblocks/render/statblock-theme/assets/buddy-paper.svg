<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Original Buddy paper: procedural color and grain, without image inputs. -->
  <defs>
    <radialGradient id="paper" cx="44%" cy="38%" r="76%">
      <stop offset="0" stop-color="#f7f0df"/>
      <stop offset="1" stop-color="#e5d7b9"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#paper)"/>
  <rect width="512" height="512" filter="url(#grain)" opacity="0.055"/>
</svg>
