<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const raw = localStorage.getItem("buddy.appearance.settings");
        const settings = raw === null
          ? { preset: localStorage.getItem("buddy.appearance.preset") }
          : JSON.parse(raw);
        const root = document.documentElement;
        if (settings?.preset === "deep-teal" || settings?.preset === "wayfinder") {
          root.dataset.buddyTheme = settings.preset;
        }
        if (settings?.accent === "sky") root.dataset.buddyAccent = "sky";
      } catch {
        // Storage is optional. The default palette is defined in CSS.
      }
    </script>
    <title>DungeonMind — Live Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
