[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeonmindbuddy"
version = "0.1.0"
description = "Narrative knowledge graph extraction and canon reduction for TTRPG campaigns"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.0.0",
    "blake3>=0.3.3",
    "pytest>=9.0.2",
    "jsonschema>=4.25.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "paramiko>=4.0.0",
    "python-docx>=1.2.0",
    # The prepare script checks out this exact source, applies the checked-in
    # terminal pre-dispatch budget patch, then uv installs the local tree.
    # Do not raise the pin without revisiting the Hermes dependency gate.
    "openai==2.24.0",
    # A3 experiment pin: newest PydanticAI whose openai extra still admits 2.24.
    # Do not raise this to 2.x in A3; that extra requires openai>=2.29.
    "pydantic-ai-slim[openai]==1.66.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "hermes-agent==0.18.2",
    # Exact runtime pin: DungeonMind PR #100 locator-null withdrawal V2.
    # Retains reviewed native evidence, source-index and V4 receipt surfaces.
    # The postgres extra carries the in-process PostgreSQL adapter
    # dependencies used by the DungeonMind-backed World Graph authority.
    "dungeonmind[postgres] @ git+https://github.com/Drakosfire/DungeonMind.git@a501784f21aaafb46d7561f46397a3afdc42f125",
    # PLAY-1 consumer seam: reviewed WorldKeeper #8 V3-compatible head.
    "worldkeeper @ git+https://github.com/Drakosfire/WorldKeeper.git@49a8620f066ce7ef8972a699020c012f50af9158",
    # Exact pin: GenerationEngine PR #10 merge (E5L deterministic client cleanup).
    "generationengine[openai] @ git+https://github.com/Drakosfire/GenerationEngine.git@9122257f5a8842e4771990a3316130bc1bf7e332",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.0", "numpy>=2.0.0"]

[project.entry-points."hermes_agent.plugins"]
dungeonbuddy_graph = "graph_memory.hermes_graph_plugin"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "embedding_smoke: live load of HF embedding model; requires DMB_SMOKE_EMBEDDING_MODEL=1 and embedding extras",
    "integration: live OpenAI or external I/O; opt-in via env vars documented per test",
    "live_llm: live OpenAI classifier cohort; run with pytest -m live_llm (excluded from default addopts)",
]
addopts = ["-m", "not live_llm", "-p", "tests.application_state.isolate_dsn"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
application_state = [
    "alembic.ini",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.ruff]
exclude = [
    ".cursor",
    "_bmad",
]

[tool.uv.sources]
hermes-agent = { path = "out/hermes-agent", editable = false }
# WorldKeeper's pinned metadata names an older DungeonMind Git commit. Normalize
# only that dependency name so this repository's exact direct source below is
# selected consistently at the Buddy-owned DungeonMind pin above.
dungeonmind = { git = "https://github.com/Drakosfire/DungeonMind.git", rev = "a501784f21aaafb46d7561f46397a3afdc42f125" }

# The pinned WorldKeeper release has one dependency, DungeonMind. Its package
# metadata override drops the conflicting URL; tool.uv.sources above retains
# Buddy's existing selected commit for that transitive name.
[[tool.uv.dependency-metadata]]
name = "worldkeeper"
version = "0.1.0"
requires-dist = ["dungeonmind"]
