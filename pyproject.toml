[project]
name = "dungeonmindbuddy"
version = "0.1.0"
description = "Narrative knowledge graph extraction and canon reduction for TTRPG campaigns"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "blake3>=0.3.3",
    "pytest>=9.0.2",
    "jsonschema>=4.25.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "paramiko>=4.0.0",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    ".cursor",
    "_bmad",
]
