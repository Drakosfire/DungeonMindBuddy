[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeonmindbuddy"
version = "0.1.0"
description = "Narrative knowledge graph extraction and canon reduction for TTRPG campaigns"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.0.0",
    "blake3>=0.3.3",
    "pytest>=9.0.2",
    "jsonschema>=4.25.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "paramiko>=4.0.0",
    "python-docx>=1.2.0",
    # Exact pin matches Hermes 0.18.2 (NousResearch/hermes-agent@861d69c7).
    # Do not raise this without revisiting the Hermes dependency gate.
    "openai==2.24.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git@861d69c7bba8d2ea6a1cd170e989c901c74d32d1",
    # Exact pin: DungeonMind PR #36 merge (exact adopted-membership receipt V3).
    # The postgres extra carries the in-process PostgreSQL adapter dependencies
    # used by the DungeonMind-backed World Graph authority (cutover).
    "dungeonmind[postgres] @ git+https://github.com/Drakosfire/DungeonMind.git@9a19584d31baea77f590d7726e508b144c7dd39d",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.0", "numpy>=2.0.0"]

[project.entry-points."hermes_agent.plugins"]
dungeonbuddy_graph = "graph_memory.hermes_graph_plugin"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "embedding_smoke: live load of HF embedding model; requires DMB_SMOKE_EMBEDDING_MODEL=1 and embedding extras",
    "integration: live OpenAI or external I/O; opt-in via env vars documented per test",
    "live_llm: live OpenAI classifier cohort; run with pytest -m live_llm (excluded from default addopts)",
]
addopts = ["-m", "not live_llm"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = [
    ".cursor",
    "_bmad",
]
