name: Publish Buddy release image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full SHA of a reviewed main or configured serving-branch merge
        required: true
        type: string
      serving_pr:
        description: Optional merged serving PR number for an APP0207 overlay
        required: false
        type: string
      serving_parent:
        description: Exact currently serving source SHA for a serving overlay
        required: false
        type: string
      hosted_guest_graph:
        description: Build the signed-out guest Graph into the UI
        required: true
        default: false
        type: boolean
      hosted_guest_build:
        description: Build the signed-out guest Build editor into the UI (requires guest Graph)
        required: true
        default: false
        type: boolean
      hosted_guest_plan:
        description: Build the signed-out guest Plan editor (requires guest Build)
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: buddy-release-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: buddy-image-release
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Require release environment enablement
        env:
          PUBLICATION_ENABLED: ${{ vars.BUDDY_IMAGE_PUBLICATION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLICATION_ENABLED" != true ]]; then
            echo "Configure and protect the buddy-image-release environment before enabling image publication." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Select the exact release source
        env:
          REVISION: ${{ inputs.revision }}
          SERVING_PR: ${{ inputs.serving_pr }}
          SERVING_PARENT: ${{ inputs.serving_parent }}
          BUDDY_SERVING_RELEASE_BRANCH: ${{ vars.BUDDY_SERVING_RELEASE_BRANCH }}
          GUEST_GRAPH: ${{ inputs.hosted_guest_graph && '1' || '0' }}
          GUEST_BUILD: ${{ inputs.hosted_guest_build && '1' || '0' }}
          GUEST_PLAN: ${{ inputs.hosted_guest_plan && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GUEST_BUILD" == 0 || "$GUEST_BUILD" == 1 ]]
          [[ "$GUEST_BUILD" == 0 || "$GUEST_GRAPH" == 1 ]]
          [[ "$GUEST_PLAN" == 0 || "$GUEST_PLAN" == 1 ]]
          [[ "$GUEST_PLAN" == 0 || "$GUEST_BUILD" == 1 ]]
          [[ "$GUEST_PLAN" == 0 || ( -n "$SERVING_PR" && -n "$SERVING_PARENT" ) ]]
          if [[ -z "$SERVING_PR" && -z "$SERVING_PARENT" ]]; then
            git rev-list --first-parent HEAD | grep -Fx "$REVISION" >/dev/null
          else
            [[ "$GUEST_GRAPH" == 1 ]]
            python3 scripts/verify_buddy_serving_release.py --revision "$REVISION" --parent "$SERVING_PARENT" --pr "$SERVING_PR"
          fi
          install -m 700 scripts/verify_guest_graph_release.sh "$RUNNER_TEMP/verify-buddy-guest-graph"
          git checkout --detach "$REVISION"
          test "$(git rev-parse HEAD)" = "$REVISION"
          test -z "$(git status --porcelain)"
      - name: Build and check the release image
        env:
          REVISION: ${{ inputs.revision }}
          GUEST_GRAPH: ${{ inputs.hosted_guest_graph && '1' || '0' }}
          GUEST_BUILD: ${{ inputs.hosted_guest_build && '1' || '0' }}
          GUEST_PLAN: ${{ inputs.hosted_guest_plan && '1' || '0' }}
          SERVING_PR: ${{ inputs.serving_pr }}
          SERVING_PARENT: ${{ inputs.serving_parent }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GUEST_GRAPH" == 0 || "$GUEST_GRAPH" == 1 ]]
          if [[ "$GUEST_GRAPH" == 1 ]]; then
            bash "$RUNNER_TEMP/verify-buddy-guest-graph" "$PWD" "$GUEST_BUILD" "$GUEST_PLAN"
          fi
          tag="$REVISION"
          guest_config='review=0;page=0;home='
          if [[ "$GUEST_GRAPH" == 1 ]]; then tag="$REVISION-guest-graph"; guest_config="$guest_config;graph=1"; fi
          if [[ "$GUEST_BUILD" == 1 ]]; then tag="$tag-build"; guest_config="$guest_config;build=1"; fi
          if [[ "$GUEST_PLAN" == 1 ]]; then tag="$tag-plan"; guest_config="$guest_config;plan=1"; fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          parent_label=()
          if [[ -n "$SERVING_PR" ]]; then
            [[ "$SERVING_PARENT" =~ ^[0-9a-f]{40}$ ]]
            parent_label=(--label "org.dungeonmindbuddy.serving-parent=$SERVING_PARENT")
          fi
          docker buildx build --platform linux/amd64 --target api --file Dockerfile.production \
            --build-arg VITE_HOSTED_GUEST_GRAPH="$GUEST_GRAPH" \
            --build-arg VITE_HOSTED_GUEST_BUILD="$GUEST_BUILD" \
            --build-arg VITE_HOSTED_GUEST_PLAN="$GUEST_PLAN" \
            --build-arg VITE_GUEST_RELEASE_REVIEW=0 \
            --build-arg VITE_GUEST_RELEASE_PAGE=0 \
            --build-arg VITE_GUEST_HOME_PUBLIC_ID= \
            "${parent_label[@]}" --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.dungeonmindbuddy.guest-build=$guest_config" --tag "$image" --load .
          if [[ -n "$SERVING_PR" ]]; then
            test "$(docker image inspect --format '{{index .Config.Labels "org.dungeonmindbuddy.serving-parent"}}' "$image")" = "$SERVING_PARENT"
          fi
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}} {{index .Config.Labels "org.dungeonmindbuddy.guest-build"}}' "$image")" = "$REVISION $guest_config"
      - name: Publish and record the immutable registry reference
        env:
          REVISION: ${{ inputs.revision }}
          REGISTRY_TOKEN: ${{ github.token }}
          GUEST_GRAPH: ${{ inputs.hosted_guest_graph && '1' || '0' }}
          GUEST_BUILD: ${{ inputs.hosted_guest_build && '1' || '0' }}
          GUEST_PLAN: ${{ inputs.hosted_guest_plan && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN

          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$GUEST_GRAPH" == 0 || "$GUEST_GRAPH" == 1 ]]
          tag="$REVISION"
          if [[ "$GUEST_GRAPH" == 1 ]]; then tag="$REVISION-guest-graph"; fi
          if [[ "$GUEST_BUILD" == 1 ]]; then tag="$tag-build"; fi
          if [[ "$GUEST_PLAN" == 1 ]]; then tag="$tag-plan"; fi
          docker image push "$repository:$tag" | tee "$DOCKER_CONFIG/push.log"
          digest=$(awk '$2 == "digest:" {print $3}' "$DOCKER_CONFIG/push.log")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$repository@$digest" >/dev/null
          {
            printf 'Buddy release source: `%s` (guest Graph: `%s`, guest Build: `%s`)\n\n' "$REVISION" "$GUEST_GRAPH" "$GUEST_BUILD"
            printf 'Stage by immutable image reference: `%s@%s`\n' "$repository" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
