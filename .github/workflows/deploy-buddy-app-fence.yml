name: Deploy Buddy (App reader fence)
run-name: Deploy Buddy App fence ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full approved serving candidate revision
        type: string
        required: true
      registry_digest:
        description: Immutable candidate registry digest from Actions publication
        type: string
        required: true
      candidate_id:
        description: Exact candidate image config digest
        type: string
        required: true
      rollback_revision:
        description: Expected healthy serving source before migration
        type: string
        required: true
      rollback_id:
        description: Expected healthy serving image before migration
        type: string
        required: true
      packet_digest:
        description: SHA-256 of the reviewed App-fence manifest committed as a fingerprint on main
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: buddy-production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: buddy-production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Submit reviewed release data and run the App-fence checks
        env:
          REVISION: ${{ inputs.revision }}
          REGISTRY_DIGEST: ${{ inputs.registry_digest }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
          ROLLBACK_ID: ${{ inputs.rollback_id }}
          PACKET_DIGEST: ${{ inputs.packet_digest }}
          RELEASE_DATA: ${{ secrets[format('BUDDY_APP_FENCE_{0}', inputs.revision)] }}
          DEPLOY_HOST: ${{ vars.BUDDY_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.BUDDY_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.BUDDY_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ && "$ROLLBACK_REVISION" =~ ^[0-9a-f]{40}$ ]]
          for digest in "$REGISTRY_DIGEST" "$CANDIDATE_ID" "$ROLLBACK_ID"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          [[ "$PACKET_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          request="app-fence $REVISION $REGISTRY_DIGEST $CANDIDATE_ID $ROLLBACK_REVISION $ROLLBACK_ID $PACKET_DIGEST"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          : "${DEPLOY_KEY:?Set the Buddy production deploy key}"
          : "${KNOWN_HOSTS:?Set the pinned Buddy production SSH host key}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -r -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_KEY
          : "${RELEASE_DATA:?Stage the reviewed JSON in the private Buddy production environment}"
          printf '%s' "$RELEASE_DATA" > "$ssh_dir/release.json"
          unset RELEASE_DATA
          python3 - "$ssh_dir/release.json" <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          fingerprint = Path('deploy/production/app-fence-releases') / (
              os.environ['REVISION'] + '.sha256'
          )
          expected = os.environ['PACKET_DIGEST']
          if fingerprint.is_symlink() or not fingerprint.is_file() or fingerprint.stat().st_size != 65:
              raise SystemExit('Missing reviewed manifest fingerprint')
          if fingerprint.read_bytes() != (expected + chr(10)).encode():
              raise SystemExit('Dispatch digest does not match the reviewed manifest fingerprint')
          payload = Path(sys.argv[1]).read_bytes()
          if not 0 < len(payload) <= 128 * 1024:
              raise SystemExit('Reviewed release data exceeds the server limit')
          files = json.loads(payload)
          if set(files) != {'manifest.json', 'release.json', 'qualification.json'}:
              raise SystemExit('Invalid reviewed release files')
          if not all(isinstance(value, str) for value in files.values()):
              raise SystemExit('Reviewed release files must contain JSON text')
          if hashlib.sha256(files['manifest.json'].encode()).hexdigest() != expected:
              raise SystemExit('Private release data does not match the reviewed manifest fingerprint')
          PYTHON
          ssh -T -F /dev/null -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "buddy-deploy@$DEPLOY_HOST" "$request" < "$ssh_dir/release.json" | tee "$ssh_dir/result"
          grep -Fxq "BUDDY_STAGED $REVISION $CANDIDATE_ID $REGISTRY_DIGEST" "$ssh_dir/result"
          grep -Fxq "BUDDY_LIVE $REVISION $CANDIDATE_ID" "$ssh_dir/result"

      - name: Check public readiness and signed-out authentication
        shell: bash
        run: |
          set -euo pipefail
          public=https://buddy.dungeonmind.net
          curl --connect-timeout 5 --max-time 15 -fsS "$public/health/ready" >/dev/null
          status=$(curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' "$public/api/auth/current-user")
          [[ "$status" == 401 ]]
