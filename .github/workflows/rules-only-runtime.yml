name: Rules-only runtime regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - apps/live_control_server/config.py
      - apps/live_control_server/models/**
      - apps/live_control_server/routes/agent.py
      - apps/live_control_server/routes/live.py
      - apps/live_control_server/services/**
      - src/application_state/**
      - tests/__init__.py
      - tests/conftest.py
      - tests/application_state/**
      - tests/test_agent_turn_route.py
      - tests/test_rules_only_parent.py
      - scripts/prepare_patched_hermes.py
      - patches/hermes-agent/**
      - pyproject.toml
      - uv.lock
      - .github/actions/install-locked-python/**
      - .github/actions/setup-python-toolchain/**
      - .github/workflows/rules-only-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-only-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rules-only-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dungeonmind
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dungeonbuddy_app_state_test_seed
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U dungeonmind -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DMB_APPLICATION_STATE_TEST_DATABASE_URL: postgresql://dungeonmind@127.0.0.1:54329/postgres
      DMB_CI_APP_TEMPLATE_DATABASE: dungeonbuddy_app_state_test_seed
      DMB_CI_WORKSTREAM_ROOT: ${{ runner.temp }}/buddy-ci-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-toolchain
      - uses: ./.github/actions/install-locked-python

      - name: Install matching PostgreSQL clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Full owning regression and lint
        run: |
          uv run --locked python scripts/ci_contract.py run rules-only-runtime
          uv run --locked ruff check apps/live_control_server/services/rules_only_runtime.py tests/test_rules_only_parent.py
