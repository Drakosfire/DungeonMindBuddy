name: Domain selection shadow report
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  shadow-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Locked dependencies and selector guards
        run: |
          python scripts/prepare_patched_hermes.py
          uv sync --locked
          uv run --locked python scripts/ci_contract.py inventory
          uv run --locked python -m pytest -q tests/test_ci_domain_shadow.py
      - name: Prediction only; never execute selection
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/ci_domain_shadow.py --base "$BASE_SHA" --head "$SOURCE_SHA" --output out/domain-shadow/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: domain-shadow-${{ github.sha }}
          path: out/domain-shadow/report.json
          if-no-files-found: error
