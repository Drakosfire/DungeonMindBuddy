name: Hosted validation

on:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: hosted-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-app-tests:
    name: Python 3.13 auth/app integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dungeonmind
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dungeonmind -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DMB_APPLICATION_STATE_TEST_DATABASE_URL: postgresql://dungeonmind@127.0.0.1:54329/postgres
    permissions:
      contents: read
    steps:
      - name: Checkout complete source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - uses: ./.github/actions/setup-python-toolchain

      - name: Verify Python runtime
        run: python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version; print(sys.version.split()[0])"

      - uses: ./.github/actions/install-locked-python

      - name: Verify psycopg import
        run: uv run --locked python -c "import psycopg; print('psycopg import succeeded')"

      - name: Lint selected hosted auth and recap files
        run: >-
          uv run --locked ruff check
          apps/live_control_server/main.py
          apps/live_control_server/services/hosted_auth.py
          apps/live_control_server/services/dms_principal.py
          tests/test_dms_principal.py
          tests/test_hosted_auth_login.py
          apps/live_control_server/services/native_recap_preparation.py
          tests/test_native_recap_preparation.py

      - name: Run auth/app integration tests
        run: uv run --locked python scripts/ci_contract.py run auth-app

  production-image-build:
    name: Production Docker build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout complete source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Read production UI build image
        id: ui-image
        shell: bash
        run: |
          image=$(awk 'toupper($1) == "FROM" && toupper($3) == "AS" && $4 == "ui-build" { print $2 }' Dockerfile.production)
          if [[ ! "$image" =~ ^node:[a-zA-Z0-9._-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "Expected exactly one digest-pinned Node image for the ui-build stage." >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Sample runner disk use during builds
        shell: bash
        run: |
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          df -B1 / "$docker_root"
          echo frontend > "$RUNNER_TEMP/buddy-build-disk.phase"
          (
            while true; do
              printf '%s %s ' "$(cat "$RUNNER_TEMP/buddy-build-disk.phase")" "$(date -u +%FT%TZ)"
              df -B1 --output=used,avail / | tail -1
              sleep 2
            done
          ) > "$RUNNER_TEMP/buddy-build-disk.tsv" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/buddy-build-disk.pid"

      - name: Test and build hosted auth UI without publishing
        env:
          UI_BUILD_IMAGE: ${{ steps.ui-image.outputs.image }}
        run: >-
          docker run --rm
          --env GITHUB_SHA="${GITHUB_SHA}"
          --env VITE_BUDDY_HOSTED_BUILD=1
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace/apps/live-control-ui
          "$UI_BUILD_IMAGE"
          sh -eu -c '
          node /workspace/scripts/ci_frontend_contract.mjs;
          du -sk node_modules dist;
          rm -rf -- node_modules dist;
          test ! -e node_modules && test ! -e dist
          '

      - name: Build production image without publishing
        run: |
          echo image > "$RUNNER_TEMP/buddy-build-disk.phase"
          docker buildx build --no-cache --file Dockerfile.production --tag dungeonmindbuddy:validation-${GITHUB_SHA::12} --load --progress plain .


      - name: Report sampled runner disk peak
        if: always()
        shell: bash
        run: |
          samples="$RUNNER_TEMP/buddy-build-disk.tsv"
          pid_file="$RUNNER_TEMP/buddy-build-disk.pid"
          if [[ -f "$pid_file" ]]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
          if [[ -s "$samples" ]]; then
            awk 'NF == 4 && $3 ~ /^[0-9]+$/ {
              phase=$1
              if (!count[phase]++) start[phase]=$3
              if ($3 > peak[phase]) { peak[phase]=$3; time[phase]=$2 }
            } END {
              for (phase in count)
                printf "%s root disk: baseline %.0f bytes, sampled peak %.0f bytes at %s, increase %.0f bytes (%d samples)\n", phase, start[phase], peak[phase], time[phase], peak[phase]-start[phase], count[phase]
              if (!count["frontend"] || !count["image"])
                print "::warning::Missing disk samples for one or more build phases"
            }' "$samples" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No disk samples collected"
          fi
