name: Hosted validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: hosted-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-app-tests:
    name: Python 3.13 auth/app integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout complete source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Verify Python runtime
        run: python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version; print(sys.version.split()[0])"

      - name: Prepare pinned patched Hermes source
        run: python scripts/prepare_patched_hermes.py

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify psycopg import
        run: uv run --locked python -c "import psycopg; print('psycopg import succeeded')"

      - name: Lint hosted auth changes
        run: >-
          uv run --locked ruff check
          apps/live_control_server/main.py
          apps/live_control_server/services/hosted_auth.py
          apps/live_control_server/services/dms_principal.py
          tests/test_dms_principal.py
          tests/test_hosted_auth_login.py
          apps/live_control_server/services/native_recap_preparation.py
          tests/test_native_recap_preparation.py

      - name: Run auth/app integration tests
        run: |
          uv run --locked pytest -q --tb=short --show-capture=no \
            tests/test_hosted_auth.py \
            tests/test_hosted_auth_login.py \
            tests/test_dms_principal.py \
            tests/test_trusted_cookie_origin.py \
            tests/test_agent_graph_auth.py \
            tests/test_native_graph_inspection.py \
            tests/test_native_recap_preparation.py

  production-image-build:
    name: Production Docker build (no push)
    needs: auth-app-tests
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout complete source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Test and build hosted auth UI without publishing
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace/apps/live-control-ui
          node:22.23.0-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
          sh -eu -c 'npm ci && npm test -- src/auth/HostedAuthGate.test.tsx src/graphLens/NativeGraphInspection.test.tsx src/graphLens/LoadedWorldGraphExplorer.test.tsx src/graphLens/WorldGraphExplorerDemand.test.tsx src/api/savedRecapRunsApi.test.ts src/modules/IngestionModule.test.tsx src/modules/IngestionModule.savedRuns.test.tsx src/modules/SourcesModule.test.tsx src/surface/modules/ChatModule.test.tsx src/api/liveApi.readEfficiency.test.tsx src/api/exactRunCandidateProjectionApi.test.ts src/planSurface/graphReviewWorkbench/GraphReviewCandidateRecapProjection.test.tsx src/worldGraph/verifyWorldGraphProjectionResponse.test.ts && npm run build'

      - name: Build production image without publishing
        run: docker buildx build --no-cache --file Dockerfile.production --tag dungeonmindbuddy:validation-${GITHUB_SHA::12} --load --progress plain .
