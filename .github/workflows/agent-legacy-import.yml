name: Verified Agent legacy import regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - src/application_state/agent_conversation/repository.py
      - tests/test_agent_legacy_import_intent.py
      - tests/application_state/test_agent_conversation_service.py
      - ci/test-classification.json
      - scripts/ci_contract.py
      - scripts/prepare_patched_hermes.py
      - patches/hermes-agent/**
      - pyproject.toml
      - uv.lock
      - .github/actions/install-locked-python/**
      - .github/actions/setup-python-toolchain/**
      - .github/workflows/agent-legacy-import.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-legacy-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verified-legacy-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dungeonmind
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dungeonbuddy_app_state_test_seed
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U dungeonmind -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DMB_APPLICATION_STATE_TEST_DATABASE_URL: postgresql://dungeonmind@127.0.0.1:54329/postgres
      DMB_CI_APP_TEMPLATE_DATABASE: dungeonbuddy_app_state_test_seed
      DMB_CI_WORKSTREAM_ROOT: ${{ runner.temp }}/buddy-ci-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-toolchain
      - uses: ./.github/actions/install-locked-python

      - name: Install matching PostgreSQL clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Verify import contract, original idempotence and atomic rollback
        run: |
          uv run --locked python scripts/ci_contract.py run agent-legacy-import
          uv run --locked python scripts/ci_contract.py inventory
          uv run --locked ruff check src/application_state/agent_conversation/repository.py tests/test_agent_legacy_import_intent.py
