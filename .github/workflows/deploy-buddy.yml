name: Deploy Buddy (image only)
run-name: Deploy Buddy ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full SHA of the approved Buddy image
        type: string
        required: true

      registry_digest:
        description: Immutable digest from the approved publication run
        type: string
        required: false
      candidate_id:
        description: Image config digest from the approved registry manifest
        type: string
        required: false
      rollback_revision:
        description: Expected currently serving source revision
        type: string
        required: false
      rollback_id:
        description: Expected currently serving image ID
        type: string
        required: false
      release_mode:
        description: Release mode accepted by the production staging helper
        type: string
        default: default
        required: true
      document_digest:
        description: Approved guest document template SHA-256, when required
        type: string
        required: false

permissions: {}

concurrency:
  group: buddy-production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: buddy-production
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Stage and activate the approved Buddy image
        env:
          REVISION: ${{ inputs.revision }}
          REGISTRY_DIGEST: ${{ inputs.registry_digest }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
          ROLLBACK_ID: ${{ inputs.rollback_id }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          DOCUMENT_DIGEST: ${{ inputs.document_digest }}
          DEPLOY_HOST: ${{ vars.BUDDY_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.BUDDY_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.BUDDY_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          request=$REVISION
          if [[ -n "$REGISTRY_DIGEST$CANDIDATE_ID$ROLLBACK_REVISION$ROLLBACK_ID" ]]; then
            [[ "$ROLLBACK_REVISION" =~ ^[0-9a-f]{40}$ ]]
            for digest in "$REGISTRY_DIGEST" "$CANDIDATE_ID" "$ROLLBACK_ID"; do
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            done
            [[ "$RELEASE_MODE" =~ ^[a-z-]+$ ]]
            [[ -z "$DOCUMENT_DIGEST" || "$DOCUMENT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            request="$REVISION $REGISTRY_DIGEST $CANDIDATE_ID $ROLLBACK_REVISION $ROLLBACK_ID $RELEASE_MODE"
            if [[ -n "$DOCUMENT_DIGEST" ]]; then
              request+=" $DOCUMENT_DIGEST"
            fi
          else
            [[ "$RELEASE_MODE" == default && -z "$DOCUMENT_DIGEST" ]]
          fi
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          : "${DEPLOY_KEY:?Set the Buddy production deploy key}"
          : "${KNOWN_HOSTS:?Set the pinned Buddy production SSH host key}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -r -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_KEY
          ssh -nT -F /dev/null -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "buddy-deploy@$DEPLOY_HOST" "$request" | tee "$ssh_dir/result"
          if [[ -n "$CANDIDATE_ID" ]]; then
            grep -Fxq "BUDDY_STAGED $REVISION $CANDIDATE_ID $REGISTRY_DIGEST" "$ssh_dir/result"
            grep -Fxq "BUDDY_LIVE $REVISION $CANDIDATE_ID" "$ssh_dir/result"
          else
            grep -Eq "^BUDDY_LIVE $REVISION sha256:[0-9a-f]{64}$" "$ssh_dir/result"
          fi

      - name: Check public Buddy readiness and signed-out authentication
        shell: bash
        run: |
          set -euo pipefail
          public=https://buddy.dungeonmind.net
          curl --connect-timeout 5 --max-time 15 -fsS "$public/health/ready" >/dev/null
          status=$(curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' "$public/api/auth/current-user")
          [[ "$status" == 401 ]]
