name: World ownership core tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: world-ownership-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  world-ownership-tests:
    name: Synthetic ownership and registry tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dungeonmind
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dungeonmind -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DMB_APPLICATION_STATE_TEST_DATABASE_URL: postgresql://dungeonmind@127.0.0.1:54329/postgres
    steps:
      - name: Checkout complete source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Prepare pinned patched Hermes source
        run: python scripts/prepare_patched_hermes.py

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint ownership and binding changes
        run: >-
          uv run --locked ruff check
          src/application_state/content/types.py
          src/application_state/content/repository.py
          src/application_state/content/service.py
          src/application_state/content/pages.py
          src/application_state/content/import_pages.py
          scripts/adopt_authored_pages.py
          src/application_state/migrations/versions/20261031_0101_authored_pages.py
          tests/application_state/test_authored_pages_postgres.py
          tests/application_state/test_authored_page_adoption.py
          src/application_state/world_catalog/service.py
          tests/application_state/test_world_catalog_postgres.py
          tests/application_state/test_world_catalog_cutover_migration.py
          tests/application_state/world_catalog_fixtures.py
          apps/live_control_server/services/build_related_pages.py
          apps/live_control_server/services/build_document_proposal.py
          apps/live_control_server/services/graph_document_relationship.py
          apps/live_control_server/services/connected_page_authoring.py
          apps/live_control_server/services/workspace_document_registry.py
          tests/test_graph_document_source.py
          apps/live_control_server/services/world_container_registry.py
          apps/live_control_server/services/world_graph_binding.py
          tests/conftest.py
          tests/test_live_recap_ingest_graph_preview_api.py
          tests/test_world_access_control.py
          tests/test_world_container_registry.py
          tests/test_world_graph_binding.py
          tests/test_reviewed_native_graph_activation.py
          tests/test_world_admission_without_corpus_directory.py
          tests/test_live_world_containers.py
          tests/test_local_graph_launch_profile.py
          apps/live_control_server/services/reviewed_corpus_publication.py
          tests/test_reviewed_corpus_publication.py

      - name: Run synthetic ownership boundary tests
        run: >-
          uv run --locked pytest -q --tb=short --show-capture=no
          tests/application_state/test_world_catalog_postgres.py
          tests/application_state/test_world_catalog_cutover_migration.py
          tests/application_state/test_authored_pages_postgres.py
          tests/application_state/test_authored_page_adoption.py
          tests/application_state/test_plan_work_object_postgres.py::test_working_copy_survives_new_connection
          tests/application_state/test_plan_work_object_postgres.py::test_current_world_plan_read_returns_immutable_basis_and_divergence
          tests/application_state/test_plan_work_object_postgres.py::test_cas_conflict_one_success
          tests/application_state/test_plan_work_object_postgres.py::test_stale_cas_identical_commit_replay_returns_existing_revision
          tests/application_state/test_plan_work_object_postgres.py::test_tiptap_exact_commit_replay_returns_existing_revision
          tests/application_state/test_plan_work_object_postgres.py::test_transaction_failure_before_commit_leaves_no_partial_revision
          tests/application_state/test_runbook_work_object_postgres.py::test_historical_revision_survives_newer_commit
          tests/application_state/test_runbook_work_object_postgres.py::test_divergent_working_copy_blocks_start_run_but_not_existing_run_n
          tests/application_state/test_runbook_work_object_postgres.py::test_plan_and_runbook_mutations_reject_wrong_kind
          tests/test_world_access_control.py
          tests/test_world_container_registry.py
          tests/test_world_graph_binding.py
          tests/test_reviewed_native_graph_activation.py
          tests/test_world_admission_without_corpus_directory.py
          tests/test_live_world_containers.py
          tests/test_local_graph_launch_profile.py
          tests/test_live_recap_ingest_graph_preview_api.py::test_recap_ingest_generate_recap_memory_with_graph_extraction_fake_client
          tests/test_demo_j1_native_world_source_admission.py::test_ordinary_fresh_world_source_admission_needs_no_active_graph
          tests/test_plan_action_prompt_evidence.py::test_mounted_prompt_reads_require_authentication_and_exact_world_selector
          tests/test_plan_action_terminal_diagnostic.py::test_mounted_diagnostic_read_requires_auth_owner_and_exact_selector
          tests/test_reviewed_corpus_publication.py

      - name: Run saved-page owner and semantic-reader tests
        run: >-
          uv run --locked pytest -q --tb=short --show-capture=no
          tests/test_graph_document_source.py
          tests/test_graph_document_relationship.py
          tests/test_build_document_proposal.py
          tests/test_build_related_pages.py::test_source_owner_refuses_changed_or_foreign_saved_page
          tests/test_connected_page_authoring.py::test_saved_excerpt_uses_coherent_committed_owner_projection
          tests/test_connected_page_authoring.py::test_saved_origin_refuses_mismatch_before_reservation
          tests/test_workspace_document_registry.py::test_saved_snapshot_owner_refuses_redirected_page_target
          tests/test_workspace_document_registry.py::test_snapshot_committed_missing_file_is_integrity_failure
