name: World ownership core tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: world-ownership-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  world-ownership-suites:
    name: Ownership boundary tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [world-and-content, ingestion-and-review, query-and-answer, saved-page-readers]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'saved-page-readers' && 45 || 30 }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dungeonmind
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dungeonmind -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DMB_APPLICATION_STATE_TEST_DATABASE_URL: postgresql://dungeonmind@127.0.0.1:54329/postgres
    steps:
      - name: Checkout complete source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Prepare pinned patched Hermes source
        run: python scripts/prepare_patched_hermes.py

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Inventory and validate CI contracts
        if: matrix.suite == 'world-and-content'
        run: |
          uv run --locked python scripts/ci_contract.py inventory
          uv run --locked pytest -q tests/test_ci_contract.py tests/test_ci_qualification.py
          uv run --locked ruff check scripts/ci_contract.py tests/test_ci_contract.py scripts/qualification tests/test_ci_qualification.py

      - name: Lint ownership and binding changes
        if: matrix.suite == 'world-and-content'
        run: >-
          uv run --locked ruff check
          scripts/ownership_ci_partition.py
          tests/test_ownership_ci_partition.py
          tests/application_state/conftest.py
          tests/test_application_state_database_fixture.py
          src/application_state/migrations/env.py
          src/application_state/content/types.py
          src/application_state/content/repository.py
          src/application_state/content/service.py
          src/application_state/source/service.py
          src/graph_memory/ingestion/native_recap_source.py
          tests/test_native_recap_source_identity.py
          apps/live_control_server/services/exact_run_evidence_correction.py
          apps/live_control_server/services/graph_run_registry.py
          tests/test_database_literal_correction_parent.py
          tests/test_database_worldbuilding_correction_parent.py
          tests/test_recap_literal_evidence_correction.py
          tests/test_demo_derived_candidate_evidence_correction.py
          src/application_state/source/repository.py
          src/application_state/agent_conversation/native_source_catalog.py
          tests/test_source_input_metadata_database.py
          src/application_state/content/pages.py
          src/application_state/content/import_pages.py
          scripts/adopt_authored_pages.py
          src/application_state/migrations/versions/20261031_0101_authored_pages.py
          tests/application_state/test_authored_pages_postgres.py
          tests/test_authored_page_database_cutover.py
          tests/application_state/test_authored_page_adoption.py
          src/application_state/world_catalog/service.py
          tests/application_state/test_world_catalog_postgres.py
          tests/application_state/test_world_catalog_cutover_migration.py
          tests/application_state/world_catalog_fixtures.py
          apps/live_control_server/services/build_related_pages.py
          apps/live_control_server/services/build_document_proposal.py
          apps/live_control_server/services/graph_document_relationship.py
          apps/live_control_server/services/connected_page_authoring.py
          apps/live_control_server/services/workspace_document_registry.py
          tests/test_graph_document_source.py
          apps/live_control_server/services/world_container_registry.py
          apps/live_control_server/services/world_graph_binding.py
          tests/conftest.py
          tests/test_live_recap_ingest_graph_preview_api.py
          tests/test_world_access_control.py
          tests/test_world_container_registry.py
          tests/test_world_graph_binding.py
          tests/test_native_world_creature_selection.py
          tests/test_native_threat_creation.py
          tests/test_reviewed_native_graph_activation.py
          tests/test_world_admission_without_corpus_directory.py
          tests/test_live_world_containers.py
          tests/test_local_graph_launch_profile.py

      - name: Run World and Content ownership tests
        if: matrix.suite == 'world-and-content'
        run: uv run --locked python scripts/ci_contract.py run world-and-content

      - name: Run ingestion and reviewed publication tests
        if: matrix.suite == 'ingestion-and-review'
        run: uv run --locked python scripts/ci_contract.py run ingestion-and-review

      - name: Run query answer-authority regressions
        if: matrix.suite == 'query-and-answer'
        run: uv run --locked python scripts/ci_contract.py run query-and-answer

      - name: Run saved-page owner and semantic-reader tests
        if: matrix.suite == 'saved-page-readers'
        run: uv run --locked python scripts/ci_contract.py run saved-page-readers


  world-ownership-tests:
    name: Synthetic ownership and registry tests
    if: always()
    needs: world-ownership-suites
    runs-on: ubuntu-24.04
    steps:
      - name: Require every ownership group to pass
        env:
          SUITE_RESULT: ${{ needs.world-ownership-suites.result }}
        run: test "$SUITE_RESULT" = success
