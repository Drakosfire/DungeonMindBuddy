<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Statblocks — Mireward prep</title>
  <link rel="stylesheet" href="assets/prep.css" />
  <link rel="stylesheet" href="assets/prep-markdown-themes.css" />
</head>
<body class="statblocks-page">
  <div class="wrap">
    <nav id="site-nav" class="site-nav"></nav>

    <header class="statblocks-header">
      <h1>Statblocks</h1>
      <div class="statblocks-toolbar">
        <button type="button" class="primary" data-open-toolbox="statblock">Command toolbox</button>
        <span class="pill pill-neutral statblocks-count" id="statblock-index-count">…</span>
      </div>
    </header>

    <div id="statblock-corpus-index" class="statblock-corpus-index">
      <p class="muted">Loading corpus statblocks…</p>
    </div>
  </div>
  <script src="assets/prep-markdown.js"></script>
  <script src="assets/prep-markdown-themes.js"></script>
  <script src="assets/prep.js"></script>
  <script>
    MirewardPrep.initNav("statblocks");
    MirewardPrep.wireRepoLinks();
    MirewardPrep.initMarkdownEmbeds();
    MirewardPrep.initStatblockCorpusIndex();
  </script>
</body>
</html>
