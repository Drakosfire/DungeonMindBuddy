<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DungeonBuddy · Cards prototype</title><link rel="stylesheet" href="style.css"></head><body><header><strong>DungeonBuddy <small>LOCAL PROTOTYPE</small></strong><select id="document" aria-label="Adventure document"></select><nav><button id="plan">Plan</button><button id="play">Play</button><button id="cards">Cards</button><button id="long">Document</button></nav><button id="meatMind">Meat Mind</button><button id="create">Create scene</button><details class="document-actions"><summary>Files</summary><button id="exportSession">Back up full session</button><button id="exportPrep">Export prep</button><button id="exportOutcomes">Export outcomes</button></details></header><div class="workspace"><aside><h2 id="indexTitle">Outline</h2><div id="index"></div></aside><main><nav id="context" aria-label="Scene toolbar"></nav><article id="content"></article></main><section id="journal"><h2>Decision log</h2><p>Saved player choices and optional notes. Stored in this browser; Files → Export outcomes saves a copy for recap work.</p><div id="outcomes"></div></section></div><dialog id="editor"><form method="dialog"><h2 id="editorTitle">Edit preparation</h2><p id="editorHelp">This edits a local copy of this card. Stable markers remain intact.</p><div id="fields"></div><p id="errors" role="alert"></p><button value="cancel">Cancel</button><button id="apply" type="button">Apply preparation</button></form></dialog><button id="togglePlayPad" class="play-pad-toggle" aria-controls="playPad" aria-expanded="false">Notes</button><section id="playPad" class="play-pad" aria-label="Shared play notepad" hidden><header><strong>Play notes</strong><button id="exportPlayPad">Export</button><button id="closePlayPad" aria-label="Close play notes">×</button></header><label for="playPadText">Your writing · shared across every card</label><textarea id="playPadText" placeholder="What happened? What do you w
